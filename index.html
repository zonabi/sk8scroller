<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a1026" />
<link rel="manifest" href="/manifest.webmanifest" />

<title>SK8SCROLLER</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0714; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { width: 100vw; height: 100dvh; }
  #rotate { display: none; position: fixed; inset: 0; background: #0b0714; color: #ffd23f;
    font: bold 20px monospace; align-items: center; justify-content: center; text-align: center; z-index: 9; }
  /* Loading screen: pure HTML/CSS so it is on screen before any JS runs. Animations are transform/opacity
     only, so they keep moving on the compositor while the main thread is busy generating art. */
  #loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vh;
    overflow: hidden; color: #f5f5f5; transition: opacity .35s; --p: .05;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(10,6,18,.85) 100%),
      repeating-linear-gradient(0deg, transparent 0 26px, #241430 26px 29px),
      repeating-linear-gradient(90deg, #4a2740 0 62px, #241430 62px 65px),
      #4a2740; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .piece { position: relative; font: 400 min(15vw, 24vh)/1 "Sedgwick Ave Display", system-ui, sans-serif; letter-spacing: .01em;
    transform: rotate(-4deg) scale(.6); opacity: 0; white-space: nowrap; }
  #loading.fonts .piece { animation: slap .28s cubic-bezier(.2,1.6,.4,1) forwards; }
  #loading .piece span { display: block; }
  #loading .piece .sh, #loading .piece .ol { position: absolute; inset: 0; }
  #loading .piece .sh { color: #00d9ff; -webkit-text-stroke: .16em #00d9ff; transform: translate(.07em, .07em); }
  #loading .piece .ol { color: #1a1026; -webkit-text-stroke: .16em #1a1026; }
  #loading .piece .fl { position: relative; background: linear-gradient(#ffd23f 25%, #ff3d6e 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #loading .drip { position: absolute; top: 78%; width: .035em; border-radius: 1em; background: #ff3d6e; transform-origin: top; transform: scaleY(0); }
  #loading.fonts .drip { animation: drip 1.6s ease-out forwards; }
  #loading .drip::after { content: ""; position: absolute; left: -45%; bottom: -.03em; width: 190%; aspect-ratio: 1; border-radius: 50%; background: inherit; }
  #loading .can { position: relative; width: min(60vw, 520px); height: 22px; border-radius: 12px; background: #1a1026; box-shadow: 0 0 0 4px #1a1026, 5px 6px 0 4px rgba(0,0,0,.35); overflow: hidden; }
  #loading .can i { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(90deg, #3dff8f, #00d9ff 45%, #ffd23f 75%, #ff3d6e); transform-origin: left; transform: scaleX(var(--p)); transition: transform .25s ease-out; }
  #loading .can b { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1.6px) 0 0/9px 7px; mix-blend-mode: overlay; }
  #loading .row { display: flex; align-items: center; gap: 14px; font: 400 min(4.2vw, 22px)/1 "Permanent Marker", system-ui, sans-serif; opacity: 0; transform: rotate(-1.5deg); text-shadow: 2px 2px 0 #1a1026, -2px 2px 0 #1a1026, 2px -2px 0 #1a1026, -2px -2px 0 #1a1026; }
  #loading.fonts .row { opacity: 1; }
  #loading .wheel { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle, #1a1026 0 18%, #8a94ae 19% 36%, #ffd23f 37% 100%); box-shadow: 0 0 0 3px #1a1026;
    position: relative; animation: spin .5s linear infinite; }
  #loading .wheel::after { content: ""; position: absolute; left: 44%; top: 6%; width: 12%; height: 22%; background: #fff6c8; border-radius: 2px; }
  #loading .tape { position: absolute; bottom: 7vh; padding: 7px 18px; background: #f6e7a1; color: #1a1026; transform: rotate(1.5deg); box-shadow: 2px 3px 0 rgba(0,0,0,.35);
    font: 400 min(3.4vw, 16px)/1.2 "Permanent Marker", system-ui, sans-serif; opacity: 0; }
  #loading.fonts .tape { opacity: 1; }
  @keyframes slap { to { transform: rotate(-4deg) scale(1); opacity: 1; } }
  @keyframes drip { to { transform: scaleY(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* full-screen button: a paint-marker sticker in the corner, menu only */
  #fs { position: fixed; z-index: 4; right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); width: 46px; height: 46px; padding: 0;
    display: none; align-items: center; justify-content: center; border: 3px solid #1a1026; border-radius: 12px; background: #ffd23f; color: #1a1026;
    box-shadow: 3px 4px 0 #1a1026; transform: rotate(-4deg); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #fs:active { transform: rotate(-4deg) translate(2px, 3px); box-shadow: 1px 1px 0 #1a1026; }
  body.in-menu #fs { display: flex; }
  #fs svg { width: 26px; height: 26px; }
  #fs .exit, #fs.on .enter { display: none; }
  #fs.on .exit { display: block; }
  #fs.on { background: #00d9ff; }
  #fs-toast { position: fixed; z-index: 4; right: calc(66px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 62vw; padding: 8px 14px;
    background: #f6e7a1; color: #1a1026; font: 400 14px/1.25 "Permanent Marker", system-ui, sans-serif; transform: rotate(1deg) scale(.9); transform-origin: right bottom;
    box-shadow: 2px 3px 0 rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #fs-toast.show { opacity: 1; transform: rotate(1deg) scale(1); }
  /* "that felt wrong" flag: tap during a run to mark the moment in the recording */
  #flag { position: fixed; z-index: 4; left: 50%; top: calc(6px + env(safe-area-inset-top)); width: 44px; height: 38px; margin-left: -22px; padding: 0; display: none;
    align-items: center; justify-content: center; border: 3px solid #1a1026; border-radius: 10px; background: #ff3d6e; color: #1a1026; opacity: .55;
    box-shadow: 2px 3px 0 #1a1026; transform: rotate(3deg); touch-action: none; -webkit-tap-highlight-color: transparent; }
  body.in-game #flag { display: flex; }
  #flag svg { width: 20px; height: 20px; }
  #flag.hit { animation: flagged .5s ease-out; }
  @keyframes flagged { 0% { transform: rotate(3deg) scale(1.5); opacity: 1; background: #ffd23f; } 100% { transform: rotate(3deg) scale(1); opacity: .55; } }
  /* tuning panel (menu only) */
  #tune { position: fixed; inset: 0; z-index: 8; background: rgba(10,6,18,.86); display: flex; justify-content: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font: 14px/1.3 system-ui, sans-serif; color: #f5f5f5; touch-action: pan-y; }
  #tune .box { width: min(680px, 100%); padding: 14px calc(14px + env(safe-area-inset-right)) 40px calc(14px + env(safe-area-inset-left)); box-sizing: border-box; }
  #tune header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; background: #1a1026; padding: 8px 0; z-index: 1; }
  #tune h2 { margin: 0 6px 0 0; font: 400 26px/1 "Rubik Spray Paint", system-ui; color: #ffd23f; }
  #tune .n { flex: 1; color: #00d9ff; font-family: "Permanent Marker", system-ui; }
  #tune button { border: 2px solid #1a1026; border-radius: 8px; padding: 8px 10px; background: #f6e7a1; color: #1a1026; font: 400 13px/1 "Permanent Marker", system-ui; box-shadow: 2px 3px 0 #000; }
  #tune button.x { background: #3dff8f; }
  #tune p { margin: 8px 0 4px; color: #b8c2d8; font-size: 12px; }
  #tune h3 { margin: 16px 0 4px; font: 400 16px/1.1 "Permanent Marker", system-ui; color: #ff3d6e; }
  #tune .r { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.05); margin-top: 4px; border-left: 4px solid transparent; }
  #tune .r.ch { border-left-color: #00d9ff; background: rgba(0,217,255,.12); }
  #tune .l { flex: 1; min-width: 0; } #tune .l b { display: block; font-weight: 600; } #tune small { display: block; color: #9aa3b8; font-size: 11px; } #tune .was { color: #ffd23f; }
  #tune .c { display: flex; align-items: center; gap: 8px; } #tune input[type=range] { width: min(38vw, 220px); } #tune output { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  #tune .sw { position: relative; width: 52px; height: 30px; } #tune .sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; }
  #tune .sw i { position: absolute; inset: 0; border-radius: 15px; background: #4a4460; transition: background .15s; }
  #tune .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #f5f5f5; transition: transform .15s; }
  #tune .sw input:checked + i { background: #3dff8f; } #tune .sw input:checked + i::after { transform: translateX(22px); }
  /* HTML sheets over the game: how to play, pause, settings (see game/panels.ts) */
  .panel { position: fixed; inset: 0; z-index: 8; background: rgba(10,6,18,.9); display: flex; justify-content: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font: 14px/1.3 system-ui, sans-serif; color: #f5f5f5; touch-action: pan-y; }
  .panel .box { width: min(760px, 100%); padding: 10px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left)); box-sizing: border-box; }
  .panel header { display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: #1a1026; padding: 6px 0; z-index: 1; }
  .panel h2 { flex: 1; margin: 0; font: 400 26px/1 "Rubik Spray Paint", system-ui; color: #ffd23f; transform: rotate(-1.5deg); transform-origin: left; }
  .panel button { border: 2px solid #1a1026; border-radius: 8px; padding: 9px 12px; background: #f6e7a1; color: #1a1026; font: 400 14px/1 "Permanent Marker", system-ui; box-shadow: 2px 3px 0 #000; }
  .panel button.x { background: #3dff8f; font-size: 16px; }
  #how .pads, #how .zones { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
  #how .pad, #how .zones > div { flex: 1; max-width: 360px; background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 10px 10px; text-align: center; }
  #how h3 { margin: 0 0 4px; font: 400 16px/1.1 "Permanent Marker", system-ui; color: #ff3d6e; }
  #how .pad.tr h3 { color: #ffd23f; }
  #how .pad p, #how .zones p { margin: 4px 0 0; color: #b8c2d8; font-size: 12px; }
  #how .zones p { font-size: 13px; color: #f5f5f5; text-align: left; }
  #how .d { position: relative; height: 130px; --c: #f5f5f5; }
  #how .pad.tr .d { --c: #ffd23f; }
  #how .d b { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; border: 2px solid var(--c); color: var(--c);
    background: rgba(26,16,38,.7); display: flex; align-items: center; justify-content: center; font: 700 15px/1 system-ui, sans-serif; box-sizing: border-box; }
  #how .d b.u { transform: translateY(-29px); } #how .d b.dn { transform: translateY(29px); } #how .d b.l { transform: translateX(-30px); } #how .d b.r { transform: translateX(30px); }
  #how .d span { position: absolute; font: 400 13px/1.05 "Permanent Marker", system-ui; color: #f5f5f5; white-space: nowrap; }
  #how .d span i { display: block; font: 400 10px/1.2 system-ui, sans-serif; color: #9aa3b8; }
  #how .d span.u { left: 50%; top: 0; transform: translateX(34px); text-align: left; } #how .d span.dn { left: 50%; bottom: 0; transform: translateX(34px); text-align: left; }
  #how .d span.l { right: calc(50% + 56px); top: 50%; transform: translateY(-50%); text-align: right; } #how .d span.r { left: calc(50% + 56px); top: 50%; transform: translateY(-50%); text-align: left; }
  #how .pad.tr .d span { color: #9aa3b8; font-size: 11px; }
  #how ol { margin: 10px 0 0; padding-left: 22px; font-size: 13px; } #how li { margin-top: 3px; } #how li b { color: #3dff8f; font-weight: 600; }
  @media (min-width: 1000px) and (min-height: 600px) { .panel .box { zoom: 1.45; } }
  .panel .box.narrow { width: min(460px, 100%); }
  .panel .menu { display: flex; flex-direction: column; gap: 9px; align-items: stretch; margin: 12px auto 0; max-width: 300px; }
  .panel .menu button { font-size: 17px; padding: 11px 12px; } .panel .menu button.x { font-size: 22px; padding: 13px 12px; }
  .panel .set { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; background: rgba(255,255,255,.06); margin-top: 6px; }
  .panel .set > div { flex: 1; min-width: 0; } .panel .set b { display: block; font-weight: 600; } .panel .set small { display: block; color: #9aa3b8; font-size: 11px; }
  .panel .set button { min-width: 74px; } .panel button.warn { background: #ff3d6e; color: #fff; }
  #settings-sheet, #how { z-index: 9; background: rgba(10,6,18,.97); }   /* these can sit on top of the pause sheet */
  /* pause button: beside the flag during a run */
  #pause { position: fixed; z-index: 4; left: 50%; top: calc(6px + env(safe-area-inset-top)); width: 44px; height: 38px; margin-left: 4px; padding: 0; display: none;
    align-items: center; justify-content: center; gap: 5px; border: 3px solid #1a1026; border-radius: 10px; background: #f6e7a1; opacity: .55;
    box-shadow: 2px 3px 0 #1a1026; transform: rotate(-3deg); touch-action: none; -webkit-tap-highlight-color: transparent; }
  #pause i { width: 6px; height: 16px; background: #1a1026; border-radius: 2px; }
  body.can-pause #pause { display: flex; }
  body.can-pause #flag { margin-left: -48px; }
  body.can-pause:not(.in-game) #pause { margin-left: -22px; }
  #how .foot { margin: 8px 0 0; color: #9aa3b8; font-size: 12px; } #how .foot b { color: #f6e7a1; }
  #fps { position: fixed; left: 4px; bottom: 4px; color: #3dff8f; font: 12px monospace; z-index: 6; pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">
  <div class="piece">
    <span class="sh">SK8SCROLLER</span><span class="ol">SK8SCROLLER</span><span class="fl">SK8SCROLLER</span>
    <div class="drip" style="left:9%;height:.42em;animation-delay:.3s"></div>
    <div class="drip" style="left:27%;height:.2em;animation-delay:.55s"></div>
    <div class="drip" style="left:48%;height:.55em;animation-delay:.4s"></div>
    <div class="drip" style="left:71%;height:.3em;animation-delay:.7s"></div>
    <div class="drip" style="left:88%;height:.46em;animation-delay:.5s"></div>
  </div>
  <div class="can"><i></i><b></b></div>
  <div class="row"><div class="wheel"></div><span class="stage">shaking the cans…</span></div>
  <div class="tape" id="tip"></div>
</div>
<script>
  // a different tip each load
  (function () {
    var tips = ['swipe mid-grind to switch up — every stance is another multiplier', 'land before the trick finishes or you slam', 'hold jump for full height, tap for a hop', 'kickers send you higher: room for two tricks', 'the combo banks about a second after you land'];
    document.getElementById('tip').textContent = 'tip: ' + tips[Math.floor(Math.random() * tips.length)];
  })();
</script>
<button id="fs" aria-label="Full screen">
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
</button>
<div id="fs-toast">iPhone: tap Share, then “Add to Home Screen” — it opens full screen from there.</div>
<button id="pause" aria-label="Pause"><i></i><i></i></button>
<button id="flag" aria-label="Flag this moment"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 2h2v20H5zM8 3h11l-3 4.5 3 4.5H8z"/></svg></button>
<div id="fps"></div>
<div id="rotate">ROTATE YOUR PHONE<br/>↻ landscape</div>
<script type="module" src="/src/game/main.ts"></script>
</body>
</html>
